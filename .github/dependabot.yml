version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: build
      groups:
          npm-minor-and-patch:
              patterns: ["*"]
              update-types: ["minor", "patch"]
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: ci
      groups:
          actions:
              patterns: ["*"]
